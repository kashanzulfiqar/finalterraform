name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment to Destroy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

jobs:
  destroy-infra:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          cd environments/${{ github.event.inputs.environment }}
          terraform init

      - name: Terraform Destroy
        run: |
          cd environments/${{ github.event.inputs.environment }}
          terraform destroy -auto-approve

      - name: Display Summary
        run: |
          echo "### 🗑️ Infrastructure Destroyed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "**Environment Destroyed:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
